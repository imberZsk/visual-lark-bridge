name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-build.txt
          pnpm install --frozen-lockfile

      - name: Check sensitive information
        run: |
          pnpm run check:sensitive
          pnpm run check:naming

      - name: Lint and format
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Run complete test suite
        run: pnpm run test

      - name: Build application
        run: |
          pnpm run build:ui
          pnpm run build:sidecars

      - name: Verify Electron startup
        run: pnpm run verify:boot
