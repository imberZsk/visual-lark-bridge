name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Check shell syntax
        run: bash -n run.sh install-launch-agent.sh

      - name: Run Python tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests

      - name: Check Python syntax
        run: python3 -m py_compile lark_ai_bridge.py

      - name: Check Node.js syntax
        run: node --check lark_event_gateway.cjs
